<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#11151c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Iron Log</title>
<style>
:root{
  --bg:#11151c; --surface:#1a212c; --surface2:#232c39; --line:#313c4c;
  --txt:#eef2f7; --muted:#8a97a8; --faint:#5d6878;
  --red:#e23c3c; --red-d:#b62d2d; --green:#3fb370; --amber:#e0a53c; --blue:#3f7fd1;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px; --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);overscroll-behavior-y:none}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* top bar */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#11151c 75%,rgba(17,21,28,0));
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 10px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.eyebrow b{color:var(--red);font-weight:800}
h1{margin:2px 0 12px;font-size:25px;line-height:1.04;letter-spacing:-.01em;font-weight:850;text-transform:uppercase}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.seg button.on{background:var(--red);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.3)}

main{padding:4px var(--pad) 28px;max-width:560px;margin:0 auto}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin:12px 0}
.card.done{border-color:#274d39}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.exname{font-size:16px;font-weight:800;letter-spacing:.01em;line-height:1.15}
.exidx{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:3px}
.exmeta{text-align:right;white-space:nowrap}
.exmeta .big{font-size:21px;font-weight:800}
.exmeta .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-top:1px}
.scheme{font-size:12.5px;color:var(--muted);white-space:pre-line;margin:6px 0 2px;line-height:1.45}

/* plate viz signature */
.bar{display:flex;align-items:center;height:46px;margin:12px 0 6px;border-radius:8px;background:#151b24;border:1px solid var(--line);overflow:hidden;padding:0 8px;gap:0}
.collar{flex:0 0 26px;height:8px;background:#6d7787;border-radius:2px}
.plate{flex:0 0 auto;border-radius:3px;margin-left:3px;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:#0c0f14;font-family:var(--mono)}
.plate.lt{color:#0c0f14}.plate.dk{color:#eef2f7}
.barlbl{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--mono);padding-left:10px;white-space:nowrap}
.barlbl b{color:var(--txt)}
.barwarn{color:var(--amber)}

/* set rows */
.sets{margin-top:6px}
.srow{display:grid;grid-template-columns:24px 1fr 1fr 1fr 44px;gap:7px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:none}
.srow.complete{opacity:.92}
.sn{font-family:var(--mono);font-size:13px;color:var(--faint);text-align:center}
.fld{position:relative}
.fld input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;color:var(--txt);
  padding:11px 6px 11px;font-size:17px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.fld input:focus{outline:none;border-color:var(--blue);background:#26303f}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fld .cap{position:absolute;top:-8px;left:9px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface);padding:0 4px;font-weight:700}
.chk{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--faint)}
.chk.on{background:var(--green);border-color:var(--green);color:#08120c}
.targethint{font-size:10px;color:var(--faint);text-align:center;font-family:var(--mono);margin-top:2px}

/* rpe chips */
.rpebar{display:flex;gap:4px;overflow-x:auto;padding:7px 0 1px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rpebar::-webkit-scrollbar{display:none}
.rpechip{flex:0 0 auto;min-width:40px;padding:7px 4px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);
  font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
.rpechip.on{background:var(--amber);border-color:var(--amber);color:#1a1206;font-weight:800}

/* buttons */
.btn{display:block;width:100%;padding:16px;border-radius:13px;font-size:16px;font-weight:800;letter-spacing:.02em;text-align:center}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(226,60,60,.25)}
.btn-primary:active{background:var(--red-d)}
.btn-ghost{background:var(--surface2);border:1px solid var(--line);color:var(--txt);font-size:14px;padding:13px}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{margin:0}

/* misc */
.note{background:rgba(224,165,60,.1);border:1px solid rgba(224,165,60,.4);border-radius:11px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin:12px 0;color:#f1d49a}
.note b{color:#fff}
.ok{background:rgba(63,179,112,.1);border:1px solid rgba(63,179,112,.4);color:#bfe9d1}
.gpp .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.gpp .row:first-child{border-top:none}
.gpp .k{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em;font-weight:700;flex:0 0 96px;padding-top:2px}
.gpp .v{white-space:pre-line;color:var(--txt);line-height:1.45;text-align:right}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px;line-height:1.6}

/* setup */
.field{margin:14px 0}
.field>label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:7px}
.field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:13px;font-size:16px}
.field input.num{font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:none}
.kv span{font-size:15px;font-weight:600;color:var(--txt)}
.kv input{background:var(--surface2);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:10px;font-size:16px;text-align:right;font-family:var(--mono);width:100%}
.sectitle{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:800;margin:22px 2px 2px}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 2px 0}

/* progress */
.lift{margin:14px 0}
.lift .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.lift .nm{font-weight:800;font-size:15px}
.lift .e{font-family:var(--mono);font-size:18px;font-weight:800}
.lift .d{font-family:var(--mono);font-size:12px;margin-left:7px}
.up{color:var(--green)}.dn{color:var(--red)}.flat{color:var(--muted)}
svg.spark{width:100%;height:48px;display:block}
.logitem{font-size:13px;color:var(--muted);padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.logitem b{color:var(--txt);font-weight:700}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(20,26,35,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.04em}
nav button.on{color:var(--red)}
nav .ic{font-size:19px;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));
  background:#fff;color:#11151c;padding:11px 18px;border-radius:30px;font-size:13px;font-weight:700;z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* rest timer */
#resttimer{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));z-index:26;display:none;
  flex-direction:column;gap:9px;padding:11px 14px 12px;background:rgba(20,26,35,.98);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
#resttimer.on{display:flex}
.rt-top{display:flex;align-items:center;gap:13px}
.rt-time{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:27px;font-weight:800;min-width:78px;letter-spacing:-.01em}
.rt-mid{flex:1}
.rt-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.rt-prog{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.rt-prog>i{display:block;height:100%;width:100%;background:var(--red);transition:width .25s linear}
#resttimer.done .rt-prog>i{background:var(--green)}
#resttimer.done .rt-time{color:var(--green)}
.rt-actions{display:flex;gap:8px}
.rt-actions button{flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--txt);font-family:var(--mono);font-weight:700;font-size:14px}
.rt-actions .rt-skip{background:var(--red);border-color:var(--red);color:#fff}
body.timer-on{padding-bottom:calc(150px + env(safe-area-inset-bottom))}

/* SS scheme stepper */
.ssadj{display:flex;align-items:center;gap:16px;margin:10px 0 2px;flex-wrap:wrap}
.ssadj .grp{display:flex;align-items:center;gap:9px}
.ssadj .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ssadj .step{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface2)}
.ssadj .step button{width:36px;height:36px;font-size:19px;font-weight:700;color:var(--txt)}
.ssadj .step .val{min-width:30px;text-align:center;font-family:var(--mono);font-weight:800;font-size:15px}

/* toggle pill */
.tgl{justify-self:end;width:100%;padding:10px 0;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-weight:800;font-size:13px;text-align:center}
.tgl.on{background:var(--green);border-color:var(--green);color:#08120c}

/* set row without rpe (Starting Strength) */
.srow.norpe{grid-template-columns:24px 1fr 1fr 44px}

/* fractional plate chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.platechip{padding:11px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-family:var(--mono);font-weight:800;font-size:15px}
.platechip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.platechip.add{color:var(--muted);border-style:dashed}
</style>
</head>
<body>
<header>
  <div class="eyebrow" id="eyebrow">Iron Log</div>
  <h1 id="title">Today</h1>
  <div class="seg" id="progseg" style="display:none">
    <button data-prog="SS">Starting Strength</button>
    <button data-prog="BM">Barbell Medicine</button>
  </div>
</header>
<main id="view"></main>
<nav>
  <button data-tab="today" class="on"><span class="ic">▦</span>Today</button>
  <button data-tab="progress"><span class="ic">▲</span>Progress</button>
  <button data-tab="setup"><span class="ic">⚙</span>Setup</button>
</nav>
<div id="resttimer">
  <div class="rt-top" id="rtTop">
    <div class="rt-time" id="rtTime">0:00</div>
    <div class="rt-mid"><div class="rt-lbl" id="rtLbl">Rest</div><div class="rt-prog"><i id="rtBar"></i></div></div>
  </div>
  <div class="rt-actions">
    <button class="rt-btn" id="rtMinus">−30s</button>
    <button class="rt-btn" id="rtPlus">+30s</button>
    <button class="rt-btn rt-skip" id="rtSkip">Skip</button>
  </div>
</div>
<div class="toast" id="toast"></div>

/* ---------------- storage (window.storage -> localStorage -> memory) ------------- */
const mem={};
const Store={
  async get(k){
    try{ if(typeof window!=='undefined'&&window.storage){const r=await window.storage.get(k);return r?r.value:null;} }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!=null) return v; }catch(e){}
    return (k in mem)?mem[k]:null;
  },
  async set(k,v){
    try{ if(typeof window!=='undefined'&&window.storage){await window.storage.set(k,v);return;} }catch(e){}
    try{ localStorage.setItem(k,v); return; }catch(e){}
    mem[k]=v;
  }
};

/* ---------------- pure math ---------------- */
const SEQ=(function(){
  const T={};
  for(const rpe in DATA.rpePct){const rp=parseFloat(rpe);
    for(const reps in DATA.rpePct[rpe]){const r=parseInt(reps,10);
      const v=DATA.rpePct[rpe][reps];
      if(v!=null) T[(r-rp).toFixed(1)]=v; }}   // value is constant along m = reps - RPE
  return T;
})();
function pctFor(reps,rpe){
  reps=Math.max(1,Math.round(reps));
  rpe=Math.min(10,Math.max(4,Math.round(rpe*2)/2));
  const m=reps-rpe, key=m.toFixed(1);
  if(SEQ[key]!=null) return SEQ[key];
  const ks=Object.keys(SEQ).map(Number).sort((a,b)=>a-b);
  const lo=ks[0], hi=ks[ks.length-1];
  if(m<lo){ const sl=(SEQ[ks[1].toFixed(1)]-SEQ[lo.toFixed(1)])/(ks[1]-lo);
    return Math.min(1.05, SEQ[lo.toFixed(1)]+sl*(m-lo)); }
  const sl=(SEQ[hi.toFixed(1)]-SEQ[ks[ks.length-2].toFixed(1)])/(hi-ks[ks.length-2]);
  return Math.max(0.30, SEQ[hi.toFixed(1)]+sl*(m-hi));
}
function e1rm(w,reps,rpe){ const p=pctFor(reps,rpe); return p>0? w/p : 0; }
function targetW(e1,reps,rpe){ return e1*pctFor(reps,rpe); }
function round2(x){ return Math.round(x*100)/100; }
function fmt(x){ if(x==null||isNaN(x)) return '—'; return (Math.round(x*100)/100).toString(); }

// available plates = standard (unlimited) + user's fractional plates (one pair each), sorted desc
function availablePlates(unit){
  const arr=PLATESET[unit].map(d=>({d:d,n:Infinity}));
  const counts={}; ((S&&S.micro&&S.micro[unit])||[]).forEach(d=>{ counts[d]=(counts[d]||0)+1; });
  Object.keys(counts).forEach(k=>{ const d=parseFloat(k); if(!arr.some(p=>Math.abs(p.d-d)<1e-9)) arr.push({d:d,n:counts[k]}); });
  arr.sort((a,b)=>b.d-a.d); return arr;
}
function smallestPlateOf(plates){ let m=Infinity; plates.forEach(p=>{ if(p.n>0&&p.d<m)m=p.d; }); return isFinite(m)?m:0; }
function loadStep(unit){ const s=smallestPlateOf(availablePlates(unit)); return s>0?2*s:0; }   // smallest loadable jump
function roundToStep(x,step){ return (!step||step<=0)?x:Math.round(x/step)*step; }
// bounded greedy over plates [{d,n}] sorted desc
function loadout(total,bar,plates){
  let per=(total-bar)/2; const out=[];
  if(per<-1e-9) return {ok:false,plates:[],leftover:0};
  for(const p of plates){ let c=Math.floor((per+1e-9)/p.d); if(c>p.n)c=p.n; for(let i=0;i<c;i++){ out.push(p.d); per=+(per-p.d).toFixed(4); } }
  return {ok:Math.abs(per)<1e-6,plates:out,leftover:per};
}
function expandSets(arr){ const out=[]; (arr||[]).forEach(s=>{ const n=s.sets||1; for(let i=0;i<n;i++) out.push({reps:s.reps,rpe:s.rpe}); }); return out; }

/* Starting Strength templates (customized: row replaces power clean; chins/dips finisher) */
const SS_LIFTS=['squat','press','bench','deadlift','row'];
const SS_NAME={squat:'Squat',press:'Overhead Press',bench:'Bench Press',deadlift:'Deadlift',row:'Barbell Row',chin:'Chin-ups',dip:'Dips'};
function ssWorkout(which){
  if(which==='A') return [
    {key:'squat',sets:3,reps:5},{key:'press',sets:3,reps:5},
    {key:'deadlift',sets:1,reps:5},{key:'chin',sets:3,reps:0,amrap:true,bw:true}];
  return [
    {key:'squat',sets:3,reps:5},{key:'bench',sets:3,reps:5},
    {key:'row',sets:3,reps:5},{key:'dip',sets:3,reps:0,amrap:true,bw:true}];
}
// returns {weights,fails,next,changes[]} given a finished SS session's results
function ssAdvance(ss, results){
  const w=Object.assign({},ss.weights), f=Object.assign({},ss.fails), changes=[];
  for(const lift of SS_LIFTS){
    const r=results[lift]; if(!r) continue;            // lift not in this workout
    if(r.success){ w[lift]=round2(w[lift]+ss.inc[lift]); f[lift]=0; changes.push({lift,type:'up',to:w[lift]}); }
    else{ f[lift]=(f[lift]||0)+1;
      if(f[lift]>=3){ w[lift]=roundToStep(w[lift]*0.9,loadStep(ss.unit)); f[lift]=0; changes.push({lift,type:'deload',to:w[lift]}); }
      else changes.push({lift,type:'hold',to:w[lift],fails:f[lift]}); }
  }
  return {weights:w,fails:f,next:ss.next==='A'?'B':'A',changes};
}

/* ---------------- state ---------------- */
const BLOCKS=['I','II','III'];
let S=null;
function defaults(){
  return {
    prog:'SS', units:'lb', bar:45, tab:'today',
    ss:{ unit:'lb', next:'A',
      weights:{squat:95,press:65,bench:75,deadlift:135,row:65},
      inc:{squat:5,press:2.5,bench:2.5,deadlift:10,row:5},
      fails:{squat:0,press:0,bench:0,deadlift:0,row:0} },
    bm:{ block:'I', week:1, day:1, e1rm:{}, swaps:{} },
    rest:{ ss:180, bm:240, auto:true, sound:true },
    micro:{ lb:[], kg:[] },
    history:[],
    draft:null
  };
}
async function load(){
  const raw=await Store.get('ironlog.v1');
  S = raw? mergeDefaults(JSON.parse(raw)) : defaults();
}
function mergeDefaults(s){ const d=defaults(); return deep(d,s); }
function deep(base,ov){ if(Array.isArray(ov)) return ov; if(ov&&typeof ov==='object'){const o=Object.assign({},base);for(const k in ov)o[k]=deep(base?base[k]:undefined,ov[k]);return o;} return ov===undefined?base:ov; }
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>Store.set('ironlog.v1',JSON.stringify(S)),120); }

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1700); }
function plateClass(p){ return (p>=10||p===2.5)?'lt':'dk'; }
function bmName(orig){ return (S.bm.swaps&&S.bm.swaps[orig])||orig; }

/* ---------------- render: plate bar ---------------- */
function renderBar(total){
  const wrap=el('div','bar');
  const lo=loadout(total,S.bar,availablePlates(S.units));
  wrap.appendChild(el('div','collar'));
  if(total<=S.bar){ wrap.appendChild(el('div','barlbl','<b>'+fmt(total)+'</b> '+S.units+' · empty bar')); return wrap; }
  const maxP=PLATESET[S.units][0];
  lo.plates.forEach(p=>{
    const h=Math.round(20+ (Math.min(p,maxP)/maxP)*22); // 20..42 px
    const pl=el('div','plate '+plateClass(p), p>=2.5?fmt(p):'');
    pl.style.height=h+'px'; pl.style.width=Math.max(7,Math.round(6+p/6))+'px';
    pl.style.background=PLATECOLOR[p]||'#8a97a8';
    pl.title=fmt(p);
    wrap.appendChild(pl);
  });
  const per=lo.plates.length? lo.plates.map(fmt).join('+') : '0';
  let lbl='<b>'+fmt(total)+'</b> '+S.units+' · per side '+per;
  if(!lo.ok) lbl='<span class="barwarn"><b>'+fmt(total)+'</b> '+S.units+' · +'+fmt(lo.leftover)+'/side off-plate</span>';
  wrap.appendChild(el('div','barlbl',lbl));
  return wrap;
}

/* ---------------- DRAFT model for an in-progress workout ----------------
 draft = {prog, label, block?,week?,day?, which?, ex:[{key,name,bw,amrap, target, e1key?, scheme?, sets:[{w,reps,rpe,done,reqReps}]}]} */
function startDraft(){
  if(S.prog==='SS') S.draft=ssDraft(); else S.draft=bmDraft();
  save(); render();
}
function ssDraft(){
  const which=S.ss.next, list=ssWorkout(which);
  const ex=list.map((x,i)=>{
    const isBw=x.bw;
    const tw=isBw?0:S.ss.weights[x.key];
    const sets=[];
    for(let s=0;s<x.sets;s++) sets.push({w:isBw?'':tw,reps:x.amrap?'':x.reps,rpe:'',done:false,reqReps:x.reps,amrap:x.amrap});
    return {key:x.key,name:SS_NAME[x.key],bw:isBw,amrap:x.amrap,target:tw,sets};
  });
  return {prog:'SS',which,label:'Workout '+which,ex};
}
function bmDraft(){
  const wk=DATA.program[S.bm.block][S.bm.week];
  const day=wk.days.find(d=>d.day===S.bm.day)||wk.days[0];
  const ex=day.ex.map(e=>{
    const nm=bmName(e.name);
    const flat=expandSets(e.sets);
    const e1=S.bm.e1rm[nm];
    const step=loadStep(S.units);
    const sets=flat.map(s=>{
      const tw=e1?roundToStep(targetW(e1,s.reps,s.rpe),step):'';
      return {w:tw,reps:s.reps,rpe:s.rpe,done:false,reqReps:s.reps,tgtRpe:s.rpe};
    });
    return {key:nm,name:nm,e1key:nm,scheme:e.scheme,sets};
  });
  return {prog:'BM',block:S.bm.block,week:S.bm.week,day:S.bm.day,
    label:'Block '+S.bm.block+' · Week '+S.bm.week+' · Day '+S.bm.day,ex,gpp:wk.gpp};
}

/* ---------------- TODAY ---------------- */
function viewToday(){
  const v=$('#view'); v.innerHTML='';
  $('#progseg').style.display='flex';
  document.querySelectorAll('#progseg button').forEach(b=>b.classList.toggle('on',b.dataset.prog===S.prog));

  if(S.draft){ return renderDraft(v); }

  // pre-workout summary
  if(S.prog==='SS'){
    const which=S.ss.next;
    $('#eyebrow').innerHTML='Starting Strength · <b>up next</b>';
    $('#title').textContent='Workout '+which;
    const c=el('div','card');
    c.appendChild(el('div','exidx','Today’s lifts'));
    ssWorkout(which).forEach(x=>{
      const r=el('div','exhead'); r.style.margin='8px 0 0';
      const tw=x.bw?'BW':fmt(S.ss.weights[x.key])+' '+S.units;
      const scheme=x.amrap?(x.sets+'×AMRAP'):(x.sets+'×'+x.reps);
      r.innerHTML='<div><div class="exname">'+SS_NAME[x.key]+'</div>'
        +'<div class="scheme" style="margin:2px 0 0">'+scheme+'</div></div>'
        +'<div class="exmeta"><span class="big num">'+tw+'</span></div>';
      c.appendChild(r);
    });
    v.appendChild(c);
    const note=el('div','note','Targets carry over from your last session. Mark each set done — hit all your reps and the weight bumps next time; miss a lift 3 sessions running and it auto-deloads 10%.');
    v.appendChild(note);
    const btn=el('button','btn btn-primary','Start Workout '+which); btn.onclick=startDraft; v.appendChild(btn);
  } else {
    const wk=DATA.program[S.bm.block][S.bm.week];
    const day=wk.days.find(d=>d.day===S.bm.day);
    $('#eyebrow').innerHTML='Barbell Medicine · <b>Block '+S.bm.block+'</b>';
    $('#title').textContent='Week '+S.bm.week+' · Day '+S.bm.day;
    const c=el('div','card');
    c.appendChild(el('div','exidx',"Today’s lifts"));
    day.ex.forEach(e=>{
      const nm=bmName(e.name);
      const r=el('div'); r.style.margin='9px 0 0';
      r.innerHTML='<div class="exname">'+nm+'</div><div class="scheme">'+e.scheme+'</div>';
      c.appendChild(r);
    });
    v.appendChild(c);
    // block-4 banner
    if(S.bm.week===4){
      v.appendChild(el('div','note','<b>Final week of this block.</b> Repeat Week 4 as long as your e1RMs keep climbing. When two or more lifts stall, advance to the next block.'));
    }
    const note=el('div','note ok','Weights are RPE-driven. Enter weight, reps and RPE per set — the app estimates your 1RM and pre-fills target weights once it knows your numbers. Don’t chase the target; let RPE win on the day.');
    v.appendChild(note);
    const btn=el('button','btn btn-primary','Start Day '+S.bm.day); btn.onclick=startDraft; v.appendChild(btn);
  }
}

function renderDraft(v){
  const d=S.draft;
  $('#progseg').style.display='none';
  $('#eyebrow').innerHTML=(d.prog==='SS'?'Starting Strength':'Barbell Medicine')+' · <b>logging</b>';
  $('#title').textContent=d.label;

  d.ex.forEach((ex,ei)=>{
    const c=el('div','card'); if(ex.sets.every(s=>s.done)&&ex.sets.length) c.className='card done';
    const head=el('div','exhead');
    let metaHtml='';
    if(d.prog==='BM'){ const e1=S.bm.e1rm[ex.e1key]; metaHtml=e1?('<span class="big num">'+fmt(e1)+'</span><span class="lbl">est 1RM</span>'):'<span class="big num" style="color:#5d6878">—</span><span class="lbl">log a set</span>'; }
    else if(!ex.bw){ metaHtml='<span class="big num">'+fmt(ex.target)+'</span><span class="lbl">'+S.units+' working</span>'; }
    else metaHtml='<span class="big num">BW</span>';
    head.innerHTML='<div><div class="exidx">'+(ex.amrap?'Finisher':'Exercise '+(ei+1))+'</div><div class="exname">'+ex.name+'</div></div>'
      +'<div class="exmeta">'+metaHtml+'</div>';
    c.appendChild(head);
    if(ex.scheme) c.appendChild(el('div','scheme',ex.scheme));
    if(d.prog==='SS') c.appendChild(ssAdjust(ex));

    // plate bar (use first non-bw target / first set weight)
    if(!ex.bw){
      const w0=Number(ex.sets[0]&&ex.sets[0].w)||ex.target||0;
      const barWrap=el('div'); barWrap.appendChild(renderBar(w0)); c.appendChild(barWrap);
      ex._bar=barWrap;
    }

    const sets=el('div','sets');
    ex.sets.forEach((st,si)=>sets.appendChild(setRow(d,ei,ex,si,st)));
    c.appendChild(sets);
    v.appendChild(c);
  });

  // finish / cancel
  const fin=el('button','btn btn-primary','Finish & Save'); fin.onclick=()=>finishDraft();
  v.appendChild(fin);
  const cancel=el('button','btn btn-ghost','Discard this session'); cancel.style.marginTop='10px';
  cancel.onclick=()=>{ if(confirm('Discard this session without saving?')){ restSkip(); S.draft=null; save(); render(); } };
  v.appendChild(cancel);
}

function setRow(d,ei,ex,si,st){
  const norpe = d.prog!=='BM';
  const row=el('div','srow'+(norpe?' norpe':'')+(st.done?' complete':''));
  row.appendChild(el('div','sn',(si+1)));
  // weight
  const fw=el('div','fld');
  fw.innerHTML='<span class="cap">'+(ex.bw?'+wt':S.units)+'</span>';
  const iw=el('input'); iw.type='text'; iw.inputMode='decimal'; iw.value=st.w===''?'':st.w; iw.placeholder=ex.bw?'0':'';
  iw.oninput=()=>{ st.w=iw.value===''?'':parseFloat(iw.value); refreshBar(ex); save(); };
  fw.appendChild(iw); row.appendChild(fw);
  // reps
  const fr=el('div','fld');
  fr.innerHTML='<span class="cap">reps</span>';
  const ir=el('input'); ir.type='text'; ir.inputMode='numeric'; ir.value=st.reps===''?'':st.reps;
  ir.placeholder=st.amrap?'AMRAP':(st.reqReps||'');
  ir.oninput=()=>{ st.reps=ir.value===''?'':parseInt(ir.value,10); save(); };
  fr.appendChild(ir);
  const th=el('div','targethint', st.amrap?'max':(st.reqReps!=null?('goal '+st.reqReps):''));
  fr.appendChild(th); row.appendChild(fr);
  // rpe (Barbell Medicine only)
  let irp=null;
  if(!norpe){
    const frp=el('div','fld');
    frp.innerHTML='<span class="cap">rpe</span>';
    irp=el('input'); irp.type='text'; irp.inputMode='decimal'; irp.value=st.rpe===''?'':st.rpe;
    irp.placeholder=st.tgtRpe!=null?('@'+st.tgtRpe):'';
    irp.oninput=()=>{ st.rpe=irp.value===''?'':parseFloat(irp.value); save(); };
    frp.appendChild(irp); row.appendChild(frp);
  }
  // done
  const ck=el('button','chk'+(st.done?' on':''),'✓');
  ck.onclick=()=>{
    st.done=!st.done;
    if(st.done){
      if(st.w===''&&!ex.bw) st.w=ex.target||'';
      if(st.reps===''&&!st.amrap) st.reps=st.reqReps;
      iw.value=st.w===''?'':st.w; ir.value=st.reps===''?'':st.reps;
      refreshBar(ex);
      if(d.prog==='BM') recalcBmE1(ex);
      if(S.rest&&S.rest.auto) restStart(restDurFor(d.prog));
    }
    save(); ck.classList.toggle('on',st.done); row.classList.toggle('complete',st.done);
    rerenderMeta();
  };
  row.appendChild(ck);
  return row;
}
function refreshBar(ex){ if(!ex._bar) return; const w0=Number(ex.sets[0]&&ex.sets[0].w)||ex.target||0; ex._bar.innerHTML=''; ex._bar.appendChild(renderBar(w0)); }
function recalcBmE1(ex){
  let best=0;
  ex.sets.forEach(s=>{ const w=Number(s.w),r=parseInt(s.reps,10),rp=parseFloat(s.rpe);
    if(w>0&&r>0&&rp>=6){ best=Math.max(best,e1rm(w,r,rp)); } });
  if(best>0){ S.bm.e1rm[ex.e1key]=Math.round(best*10)/10; }
}
function rerenderMeta(){ /* lightweight: re-render whole draft to refresh est-1RM + done styling */ render(); }

/* ---------------- SS on-the-fly sets/reps ---------------- */
function ssAdjust(ex){
  const wrap=el('div','ssadj');
  const setsGrp=el('div','grp'); setsGrp.innerHTML='<span class="lbl">Sets</span>';
  const sStep=el('div','step');
  const sMinus=el('button',null,'−'), sVal=el('span','val',String(ex.sets.length)), sPlus=el('button',null,'+');
  sMinus.onclick=()=>ssSetsDelta(ex,-1); sPlus.onclick=()=>ssSetsDelta(ex,1);
  sStep.appendChild(sMinus); sStep.appendChild(sVal); sStep.appendChild(sPlus);
  setsGrp.appendChild(sStep); wrap.appendChild(setsGrp);
  if(ex.amrap){ wrap.appendChild(el('span','lbl','reps · AMRAP')); }
  else{
    const reps=ex.sets[0]?ex.sets[0].reqReps:5;
    const repGrp=el('div','grp'); repGrp.innerHTML='<span class="lbl">Reps</span>';
    const rStep=el('div','step');
    const rMinus=el('button',null,'−'), rVal=el('span','val',String(reps)), rPlus=el('button',null,'+');
    rMinus.onclick=()=>ssRepsDelta(ex,-1); rPlus.onclick=()=>ssRepsDelta(ex,1);
    rStep.appendChild(rMinus); rStep.appendChild(rVal); rStep.appendChild(rPlus);
    repGrp.appendChild(rStep); wrap.appendChild(repGrp);
  }
  return wrap;
}
function ssSetsDelta(ex,delta){
  if(delta>0){ const rq=ex.amrap?0:(ex.sets[0]?ex.sets[0].reqReps:5);
    ex.sets.push({w:ex.bw?'':ex.target,reps:'',rpe:'',done:false,reqReps:rq,amrap:ex.amrap}); }
  else if(ex.sets.length>1){ ex.sets.pop(); }
  save(); render();
}
function ssRepsDelta(ex,delta){
  const cur=ex.sets[0]?ex.sets[0].reqReps:5, nv=Math.max(1,cur+delta);
  ex.sets.forEach(s=>{ s.reqReps=nv; if(!s.done && (s.reps===''||s.reps==null)) s.reps=''; });
  save(); render();
}

/* ---------------- rest timer ---------------- */
let RT={id:null,end:0,dur:0,paused:false,left:0,done:false,_hide:null};
let AC=null;
function unlockAudio(){ try{ if(!AC){const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C();} if(AC&&AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(){ if(!S.rest||!S.rest.sound||!AC) return; try{ const t=AC.currentTime;
  [[880,0],[1320,0.18]].forEach(function(p){ const o=AC.createOscillator(),g=AC.createGain(); o.type='sine'; o.frequency.value=p[0]; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0.0001,t+p[1]); g.gain.exponentialRampToValueAtTime(0.35,t+p[1]+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+p[1]+0.16); o.start(t+p[1]); o.stop(t+p[1]+0.18); });
}catch(e){} }
function fmtClock(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
function restDurFor(prog){ const v=prog==='BM'?(S.rest&&S.rest.bm):(S.rest&&S.rest.ss); return v==null?0:v; }
function restRemaining(){ return RT.paused?RT.left:Math.max(0,(RT.end-Date.now())/1000); }
function restStart(sec){ if(!sec||sec<=0) return; unlockAudio(); clearTimeout(RT._hide);
  RT.dur=sec; RT.paused=false; RT.done=false; RT.end=Date.now()+sec*1000;
  const bar=$('#resttimer'); bar.classList.add('on'); bar.classList.remove('done'); document.body.classList.add('timer-on');
  clearInterval(RT.id); RT.id=setInterval(restTick,250); restTick();
}
function restTick(){ const bar=$('#resttimer'); if(!bar||!bar.classList.contains('on')) return;
  const r=restRemaining();
  $('#rtTime').textContent=fmtClock(r);
  $('#rtBar').style.width=(RT.dur>0?Math.max(0,Math.min(100,(r/RT.dur)*100)):0)+'%';
  $('#rtLbl').textContent=RT.paused?'Paused':(RT.done?'Rest complete — go':'Rest');
  if(!RT.paused && !RT.done && r<=0.05){
    RT.done=true; clearInterval(RT.id); RT.id=null;
    bar.classList.add('done'); $('#rtTime').textContent='0:00'; $('#rtBar').style.width='100%'; $('#rtLbl').textContent='Rest complete — go';
    beep(); clearTimeout(RT._hide); RT._hide=setTimeout(function(){ if(RT.done) restSkip(); },9000);
  }
}
function restPause(){ if(RT.done) return;
  if(RT.paused){ RT.end=Date.now()+RT.left*1000; RT.paused=false; clearInterval(RT.id); RT.id=setInterval(restTick,250); }
  else { RT.left=restRemaining(); RT.paused=true; clearInterval(RT.id); RT.id=null; }
  restTick();
}
function restAdd(delta){ if(RT.done){ if(delta>0) restStart(delta); return; }
  if(RT.paused){ RT.left=Math.max(0,RT.left+delta); }
  else { RT.end+=delta*1000; if(!RT.id) RT.id=setInterval(restTick,250); }
  restTick();
}
function restSkip(){ clearInterval(RT.id); RT.id=null; clearTimeout(RT._hide); RT.paused=false; RT.done=false;
  const bar=$('#resttimer'); if(bar){ bar.classList.remove('on'); bar.classList.remove('done'); }
  document.body.classList.remove('timer-on');
}

/* ---------------- finish ---------------- */
function finishDraft(){
  restSkip();
  const d=S.draft;
  const entry={date:Date.now(),prog:d.prog,label:d.label,exercises:[]};
  if(d.prog==='SS'){
    const results={};
    d.ex.forEach(ex=>{
      const logged=ex.sets.map(s=>({w:s.w===''?null:Number(s.w),reps:s.reps===''?null:Number(s.reps),rpe:s.rpe===''?null:Number(s.rpe),done:s.done}));
      entry.exercises.push({name:ex.name,key:ex.key,bw:ex.bw,sets:logged});
      if(SS_LIFTS.indexOf(ex.key)>=0){
        const work=ex.sets;
        const success=work.every(s=>s.done && (Number(s.reps)||0)>=s.reqReps);
        results[ex.key]={success};
      }
    });
    const adv=ssAdvance(S.ss,results);
    S.ss.weights=adv.weights; S.ss.fails=adv.fails; S.ss.next=adv.next;
    entry.changes=adv.changes;
    S.history.unshift(entry); S.draft=null; save();
    afterFinishSummary(adv.changes,'SS');
  } else {
    d.ex.forEach(ex=>{ recalcBmE1(ex);
      const logged=ex.sets.map(s=>({w:s.w===''?null:Number(s.w),reps:s.reps===''?null:Number(s.reps),rpe:s.rpe===''?null:Number(s.rpe),done:s.done}));
      entry.exercises.push({name:ex.name,key:ex.e1key,e1rm:S.bm.e1rm[ex.e1key],sets:logged});
    });
    S.history.unshift(entry);
    const wasWeek=S.bm.week, wasBlock=S.bm.block;
    advanceBM();
    S.draft=null; save();
    afterFinishSummary(null,'BM',{wasWeek,wasBlock});
  }
}
function advanceBM(){
  if(S.bm.day<3){ S.bm.day++; return; }
  S.bm.day=1;
  if(S.bm.week<4){ S.bm.week++; return; }
  // end of week 4 -> default to repeating week 4 (stay); block advance is manual via banner/setup
}
function afterFinishSummary(changes,prog,bm){
  const v=$('#view'); v.innerHTML=''; $('#progseg').style.display='none';
  $('#eyebrow').innerHTML='Session saved';
  $('#title').textContent='Nice work';
  const c=el('div','card');
  if(prog==='SS'){
    c.appendChild(el('div','exidx','Next session adjustments'));
    if(!changes.length) c.appendChild(el('div','scheme','Logged. No working lifts to progress.'));
    changes.forEach(ch=>{
      let txt='';
      if(ch.type==='up') txt='<span class="up">↑</span> '+SS_NAME[ch.lift]+' → <b class="num">'+fmt(ch.to)+' '+S.units+'</b>';
      else if(ch.type==='deload') txt='<span class="dn">↓</span> '+SS_NAME[ch.lift]+' deload → <b class="num">'+fmt(ch.to)+' '+S.units+'</b>';
      else txt='<span class="flat">→</span> '+SS_NAME[ch.lift]+' hold <span class="num" style="color:#8a97a8">('+ch.fails+'/3 miss)</span>';
      const r=el('div'); r.style.padding='7px 0'; r.style.fontSize='15px'; r.innerHTML=txt; c.appendChild(r);
    });
    const r=el('div','scheme'); r.style.marginTop='8px'; r.innerHTML='Up next: <b>Workout '+S.ss.next+'</b>';
    c.appendChild(r);
  } else {
    c.appendChild(el('div','exidx','Estimated 1RMs updated'));
    const last=S.history[0];
    last.exercises.forEach(ex=>{ if(ex.e1rm) { const r=el('div'); r.style.padding='6px 0'; r.style.fontSize='15px'; r.innerHTML=ex.name+' <b class="num">'+fmt(ex.e1rm)+' '+S.units+'</b>'; c.appendChild(r);} });
    const r=el('div','scheme'); r.style.marginTop='8px';
    r.innerHTML='Up next: <b>Block '+S.bm.block+' · Week '+S.bm.week+' · Day '+S.bm.day+'</b>';
    c.appendChild(r);
  }
  v.appendChild(c);
  // BM block-advance offer
  if(prog==='BM' && bm.wasWeek===4 && bm.wasBlock===S.bm.block){
    const idx=BLOCKS.indexOf(S.bm.block);
    if(idx<BLOCKS.length-1){
      const n=el('div','note','You just finished a Week 4 session. Repeating keeps you here. Ready to move on?');
      v.appendChild(n);
      const b=el('button','btn btn-ghost','Advance to Block '+BLOCKS[idx+1]+' →');
      b.onclick=()=>{ S.bm.block=BLOCKS[idx+1]; S.bm.week=1; S.bm.day=1; save(); go('today'); };
      v.appendChild(b);
    } else {
      v.appendChild(el('div','note','<b>Template complete.</b> You’ve finished Block III. Restart it for more linear progress, or graduate to Strength I / Powerbuilding I.'));
    }
  }
  const done=el('button','btn btn-primary','Back to Today'); done.style.marginTop='10px'; done.onclick=()=>go('today');
  v.appendChild(done);
  toast(prog==='SS'?'Workout saved':'Session saved · e1RMs updated');
}

/* ---------------- PROGRESS ---------------- */
function viewProgress(){
  const v=$('#view'); v.innerHTML=''; $('#progseg').style.display='none';
  $('#eyebrow').textContent='Progress'; $('#title').textContent='Trends';
  // gather e1rm series per exercise key from history
  const series={};
  for(let i=S.history.length-1;i>=0;i--){ const h=S.history[i];
    (h.exercises||[]).forEach(ex=>{
      let e=ex.e1rm;
      if(e==null){ // SS: derive best e1rm from logged sets
        let best=0; (ex.sets||[]).forEach(s=>{ if(s.w&&s.reps&&s.rpe) best=Math.max(best,e1rm(s.w,s.reps,s.rpe)); });
        if(!best){ // no rpe -> assume top completed set ~RPE9 as rough proxy
          (ex.sets||[]).forEach(s=>{ if(s.done&&s.w&&s.reps) best=Math.max(best,e1rm(s.w,s.reps,9)); });
        }
        e=best||null;
      }
      if(e){ (series[ex.name]=series[ex.name]||[]).push(Math.round(e*10)/10); }
    });
  }
  const names=Object.keys(series);
  if(!names.length){ v.appendChild(el('div','empty','No training logged yet.<br>Finish a workout and your estimated 1RM trends will show up here.')); return; }
  const card=el('div','card');
  names.forEach(nm=>{
    const arr=series[nm]; const cur=arr[arr.length-1], first=arr[0];
    const d=cur-first; const cls=d>0.5?'up':(d<-0.5?'dn':'flat'); const sign=d>0?'+':'';
    const lift=el('div','lift');
    lift.innerHTML='<div class="top"><span class="nm">'+nm+'</span>'
      +'<span><span class="e num">'+fmt(cur)+'</span><span class="d num '+cls+'">'+(arr.length>1?(sign+fmt(d)):'')+'</span></span></div>';
    lift.appendChild(spark(arr));
    card.appendChild(lift);
  });
  v.appendChild(card);
  // recent sessions
  const log=el('div','card'); log.appendChild(el('div','exidx','Recent sessions'));
  S.history.slice(0,12).forEach(h=>{
    const dt=new Date(h.date); const ds=(dt.getMonth()+1)+'/'+dt.getDate();
    const sets=h.exercises.reduce((a,e)=>a+(e.sets?e.sets.filter(s=>s.done||s.w).length:0),0);
    const it=el('div','logitem','<span><b>'+h.label+'</b></span><span class="num">'+ds+' · '+sets+' sets</span>');
    log.appendChild(it);
  });
  v.appendChild(log);
}
function spark(arr){
  const w=320,h=48,pad=4; const min=Math.min.apply(null,arr),max=Math.max.apply(null,arr);
  const rng=(max-min)||1; const n=arr.length;
  const x=i=>pad+(n<=1?0:(i/(n-1))*(w-2*pad)); const y=val=>h-pad-((val-min)/rng)*(h-2*pad);
  let dpath=''; arr.forEach((v,i)=>{ dpath+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; });
  const last=arr.length-1;
  const svg=el('div');
  svg.innerHTML='<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'
    +'<path d="'+dpath+'" fill="none" stroke="#3fb370" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle cx="'+x(last).toFixed(1)+'" cy="'+y(arr[last]).toFixed(1)+'" r="3.2" fill="#3fb370"/></svg>';
  return svg.firstChild;
}

/* ---------------- SETUP ---------------- */
function viewSetup(){
  const v=$('#view'); v.innerHTML=''; $('#progseg').style.display='none';
  $('#eyebrow').textContent='Setup'; $('#title').textContent='Settings';

  // program + units

  g.appendChild(fb); v.appendChild(g);

  if(S.prog==='SS'){
    v.appendChild(sectitle('Starting Strength — working weights'));
    v.appendChild(hint('The weight you’ll start (or resume) each lift at. Empty-bar warm-ups happen automatically — these are your work-set weights.'));
    const wc=el('div','field');
    SS_LIFTS.forEach(k=>wc.appendChild(kvNum(SS_NAME[k],S.ss.weights[k],val=>{S.ss.weights[k]=val;save();})));
    v.appendChild(wc);
    v.appendChild(sectitle('Per-session increases'));
    const ic=el('div','field');
    SS_LIFTS.forEach(k=>ic.appendChild(kvNum(SS_NAME[k],S.ss.inc[k],val=>{S.ss.inc[k]=val;save();})));
    v.appendChild(ic);
    const f=el('div','field'); f.innerHTML='<label>Next workout</label>';
    f.appendChild(selectEl(['A','B'],{A:'Workout A (Squat · Press · Deadlift · Chins)',B:'Workout B (Squat · Bench · Row · Dips)'},S.ss.next,val=>{S.ss.next=val;save();}));
    v.appendChild(f);
  } else {
    v.appendChild(sectitle('Barbell Medicine — your position'));
    const g2=el('div','grid2');
    const fbl=el('div','field'); fbl.innerHTML='<label>Block</label>';
    fbl.appendChild(selectEl(BLOCKS,{I:'Block I',II:'Block II',III:'Block III'},S.bm.block,val=>{S.bm.block=val;save();render();}));
    g2.appendChild(fbl);
    const fwk=el('div','field'); fwk.innerHTML='<label>Week</label>';

    g2.appendChild(fwk); v.appendChild(g2);
    const fdy=el('div','field'); fdy.innerHTML='<label>Day</label>';
    fdy.appendChild(selectEl([1,2,3],{1:'Day 1',2:'Day 2',3:'Day 3'},S.bm.day,val=>{S.bm.day=parseInt(val,10);save();}));
    v.appendChild(fdy);

    v.appendChild(sectitle('Exercise substitutions'));
    v.appendChild(hint('Swap any movement for one in the same class (or your own). Estimated 1RMs track per movement name.'));
    const uniq=bmExercisesForBlock(S.bm.block);
    const sc=el('div','field');
    uniq.forEach(orig=>{
      const wrap=el('div'); wrap.style.margin='10px 0';
      const lab=el('div'); lab.style.fontSize='13px'; lab.style.color='var(--muted)'; lab.style.margin='2px 0 5px'; lab.textContent=orig;
      wrap.appendChild(lab);
      const opts=classOptions(orig,orig);

        if(val==='__custom'){ const cu=prompt('Custom exercise name for “'+orig+'”:',bmName(orig)); if(cu){S.bm.swaps[orig]=cu;} }
        else if(val===orig){ delete S.bm.swaps[orig]; } else { S.bm.swaps[orig]=val; }
        save();render();
      });
      wrap.appendChild(sel); sc.appendChild(wrap);
    });
    v.appendChild(sc);

    v.appendChild(sectitle('Estimated 1RM (optional)'));
    v.appendChild(hint('Leave blank to let the app calculate from your first logged set. Or enter known numbers to pre-fill targets.'));
    const ec=el('div','field');
    uniq.forEach(orig=>{ const nm=bmName(orig); ec.appendChild(kvNum(nm,S.bm.e1rm[nm]||'',val=>{ if(val==='' || isNaN(val)) delete S.bm.e1rm[nm]; else S.bm.e1rm[nm]=val; save(); })); });
    v.appendChild(ec);
  }

  // plates / fractional
  v.appendChild(sectitle('Plates'));
  v.appendChild(hint('Standard plates are assumed on hand. Tap the fractional/micro plates you own (one pair each) so target weights and the loaded-bar view can use them — most useful for Barbell Medicine’s exact numbers.'));
  const pf=el('div','field');
  pf.innerHTML='<label>Fractional plates I own ('+S.units+' · per-pair)</label>';
  const chips=el('div','chips');
  const owned=(S.micro&&S.micro[S.units])||[];
  const common=(S.units==='lb')?[1.25,1,0.75,0.5,0.25]:[1,0.75,0.5,0.25];
  const shown=common.slice();
  owned.forEach(d=>{ if(shown.indexOf(d)<0) shown.push(d); });
  shown.sort((a,b)=>b-a);
  shown.forEach(d=>{
    const on=owned.indexOf(d)>=0;

  const addChip=el('button','platechip add','+ other'); addChip.onclick=()=>{ const v2=prompt('Fractional plate size in '+S.units+' (per pair), e.g. 0.5'); const d=parseFloat(v2); if(d>0) toggleMicro(d,true); };
  chips.appendChild(addChip);
  pf.appendChild(chips); v.appendChild(pf);
  const step=loadStep(S.units);

  // rest timer
  v.appendChild(sectitle('Rest timer'));
  v.appendChild(hint('Auto-starts when you check off a set. Tap the timer to pause; use −30/+30 to adjust on the fly. Barbell Medicine defaults longer.'));
  const rf=el('div','field');
  rf.appendChild(kvNum('Starting Strength rest (sec)', S.rest.ss, val=>{ S.rest.ss=(val===''||isNaN(val))?0:Math.max(0,Math.round(val)); save(); }));
  rf.appendChild(kvNum('Barbell Medicine rest (sec)', S.rest.bm, val=>{ S.rest.bm=(val===''||isNaN(val))?0:Math.max(0,Math.round(val)); save(); }));
  v.appendChild(rf);
  const tg=el('div','field');
  tg.appendChild(toggleRow('Auto-start after each set', S.rest.auto, b=>{ S.rest.auto=b; save(); }));
  tg.appendChild(toggleRow('Beep when rest ends', S.rest.sound, b=>{ S.rest.sound=b; if(b) unlockAudio(); save(); }));
  v.appendChild(tg);

  // calculator
  v.appendChild(sectitle('1RM / target calculator'));
  v.appendChild(calcWidget());

  // data
  v.appendChild(sectitle('Data'));
  v.appendChild(hint('Saved on this device. On iPhone: Share → Add to Home Screen to run it full-screen like an app.'));
  const exp=el('button','btn btn-ghost','Copy my data (backup)'); exp.onclick=()=>{ navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(S)); toast('Backup copied to clipboard'); };
  v.appendChild(exp);
  const rst=el('button','btn btn-ghost','Reset everything'); rst.style.marginTop='10px'; rst.style.color='var(--red)';
  rst.onclick=()=>{ if(confirm('Erase all settings and history? This cannot be undone.')){ S=defaults(); save(); go('today'); } };
  v.appendChild(rst);
}
function calcWidget(){
  const c=el('div','card'); c.style.margin='8px 0';
  c.innerHTML='<div class="exidx">Enter a real set → estimated 1RM</div>';
  const g=el('div','srow'); g.style.gridTemplateColumns='1fr 1fr 1fr'; g.style.borderTop='none';
  const mk=(cap,ph)=>{const f=el('div','fld');f.innerHTML='<span class="cap">'+cap+'</span>';const i=el('input');i.type='text';i.inputMode='decimal';i.placeholder=ph;f.appendChild(i);return {f,i};};
  const W=mk(S.units,'weight'),R=mk('reps','reps'),P=mk('rpe','@');
  g.appendChild(W.f);g.appendChild(R.f);g.appendChild(P.f); c.appendChild(g);
  const out=el('div','scheme'); out.style.fontSize='15px'; out.style.marginTop='8px'; out.textContent='Estimated 1RM: —';
  const calc=()=>{ const w=parseFloat(W.i.value),r=parseInt(R.i.value,10),p=parseFloat(P.i.value);
    if(w>0&&r>0&&p>=6){ const e=e1rm(w,r,p); out.innerHTML='Estimated 1RM: <b class="num">'+fmt(e)+' '+S.units+'</b>'; } else out.textContent='Estimated 1RM: —'; };
  [W.i,R.i,P.i].forEach(i=>i.oninput=calc); c.appendChild(out);
  return c;
}

/* class-based swap options */
const CLASS_LISTS={
  squat:['Back squat','Low bar back squat','Box squat','Safety bar squat','Paused Squat','Pin squat','Front Squat','Split squat','Dumbbell Squat','Leg press'],
  press:['Standing Overhead Press','Seated Barbell Overhead Press','Standing Dumbbell Press','Seated Dumbbell Press','Push Press','Machine Overhead Press','Incline Bench Press','Machine Incline Press'],
  bench:['Bench Press','Touch-and-Go Bench Press','Paused Bench Press','Close Grip Bench','Incline Bench Press','Dumbbell Bench Press','Dumbbell Incline Bench Press','Machine Chest Press'],
  pull:['Conventional deadlift','Sumo deadlift','Trap bar deadlift','Romanian Deadlift','Paused deadlift','Stiff Legged Deadlift','Rack Pull','Hip Thrusts','Dumbbell Deadlifts','Machine Deadlift'],
  row:['Barbell Rows','Lever Rows','Chest-Supported Row','1 arm Dumbbell rows','Lat Pull Downs','Machine Horizontal Row']
};
function classify(n){ n=n.toLowerCase();
  if(/row|pull down|pulldown/.test(n)) return 'row';
  if(/bench|chest press/.test(n)) return 'bench';
  if(/press|push press/.test(n)) return 'press';
  if(/deadlift|rdl|hip thrust|rack pull|good ?morning/.test(n)) return 'pull';
  if(/squat|leg press|lunge|split/.test(n)) return 'squat';
  return null;
}
function classOptions(orig,current){
  const cls=classify(orig); let list=cls?CLASS_LISTS[cls].slice():[];
  if(list.indexOf(orig)<0) list.unshift(orig);
  if(current&&list.indexOf(current)<0) list.unshift(current);
  const vals=list.concat(['__custom']); const labels={}; list.forEach(x=>labels[x]=x); labels['__custom']='Custom…';
  return {vals,labels};
}
function bmExercisesForBlock(block){
  const seen=new Set(); const out=[];
  const wk=DATA.program[block];
  Object.keys(wk).forEach(wn=>wk[wn].days.forEach(d=>d.ex.forEach(e=>{ if(!seen.has(e.name)){seen.add(e.name);out.push(e.name);} })));
  return out;
}

/* small ui builders */
function sectitle(t){ return el('div','sectitle',t); }
function hint(t){ return el('div','hint',t); }
function selectEl(vals,labels,cur,on){ const s=el('select'); vals.forEach(v=>{const o=el('option');o.value=v;o.textContent=labels[v]||v;if(String(v)===String(cur))o.selected=true;s.appendChild(o);}); s.onchange=()=>on(s.value); return s; }
function kvNum(label,val,on){ const r=el('div','kv'); r.appendChild(el('span',null,label)); const i=el('input');i.type='text';i.inputMode='decimal';i.value=(val===''||val==null)?'':val; i.oninput=()=>{const x=i.value===''?'':parseFloat(i.value); on(x);}; r.appendChild(i); return r; }
function toggleRow(label,val,on){ const r=el('div','kv'); r.appendChild(el('span',null,label)); const b=el('button','tgl'+(val?' on':''), val?'On':'Off'); b.onclick=()=>{ const nv=!b.classList.contains('on'); b.classList.toggle('on',nv); b.textContent=nv?'On':'Off'; on(nv); }; r.appendChild(b); return r; }
function toggleMicro(d,forceAdd){ if(!S.micro)S.micro={lb:[],kg:[]}; const list=S.micro[S.units]||(S.micro[S.units]=[]); const i=list.findIndex(x=>Math.abs(x-d)<1e-9); if(i>=0&&!forceAdd){ list.splice(i,1); } else if(i<0){ list.push(d); } save(); render(); }

/* ---------------- router ---------------- */
function render(){ if(S.tab==='today')viewToday(); else if(S.tab==='progress')viewProgress(); else viewSetup();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
}
function go(tab){ S.tab=tab; save(); render(); window.scrollTo(0,0); }

function init(){
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ go(b.dataset.tab); });
  document.querySelectorAll('#progseg button').forEach(b=>b.onclick=()=>{ S.prog=b.dataset.prog; save(); render(); });
  var t=$('#rtTop'); if(t) t.onclick=restPause;
  var a=$('#rtMinus'); if(a) a.onclick=()=>restAdd(-30);
  var p=$('#rtPlus'); if(p) p.onclick=()=>restAdd(30);
  var s=$('#rtSkip'); if(s) s.onclick=restSkip;
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && RT.end && !RT.done) restTick(); });
  load().then(()=>{ if(!S.tab)S.tab='today'; render(); });
}
if(typeof document!=='undefined'&&document.addEventListener) document.addEventListener('DOMContentLoaded',init);
if(typeof module!=='undefined') module.exports={pctFor,e1rm,targetW,loadout,availablePlates,smallestPlateOf,loadStep,roundToStep,round2,ssAdvance,expandSets,classify,PLATESET};
})();
